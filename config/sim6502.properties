# Configuration file for a simulated 6502.
# Loaded in the 'Digital' logic simulator.
#   6502: https://github.com/completely-unstable/6502-Digital
# Digital: https://github.com/hneemann/Digital

cpu = 6502
output_type = RAW
encoding = iso
load_address = $0600
memtop = $ffff
bss_highram_start = $0
bss_highram_end = $0
bss_goldenram_start = $0
bss_goldenram_end = $0

# $0000-$00ff ZP
# $0100-$01ff stack
# $0200-$05ff 32x32 framebuffer
# $0600-$ffff load address / user ram
# io_regions specifies memory-mapped I/O registers that should be treated differentely.
# it can be zero or more memory address ranges (inclusive) separated by comma
#io_regions = $0100-$012f
io_regions =

# zeropage scratch variables. zp_scratch_reg must always be zp_scratch_b1+1 !
zp_scratch_ptr = $f6
zp_scratch_b1 = $f8
zp_scratch_reg = $f9
zp_scratch_w1 = $fa
zp_scratch_w2 = $fc
# $fe = random byte
# $ff = unused

# a random byte is provided by reading $fe
# vblank irq run jiffy clock uses $eb,$ec,$ed
# chrout_fb uses $ee-$f5
# free zeropage locations for the various zp usage methods
# zero or more zeropage address ranges (inclusive).
zp_fullsafe = $20-$ea
zp_kernalsafe = $20-$ea
zp_basicsafe = $20-$ea

# the start of the 32 bytes used by the R0-R15 virtual registers. Can be in Zeropage or elsewhere.
virtual_registers = $0000

# replace stock startup code
custom_launcher_code = .include "startup.asm"

# Where can we find the standard library (syslib.p8). You can still add more paths manually using -srcdirs
library = ./libraries/sim6502

# additional options passed to the assembler program
assembler_options = -I ./libraries/sim6502
